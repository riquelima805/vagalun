name: Build Android Debug APK and Publish Release

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Baixa e instala o Gradle 8.7 diretamente na maquina virtual do GitHub
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Executa o Gradle do sistema (sem depender de gradlew ou wrapper no repositório)
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Debug Build #${{ github.run_number }}"
          body: "APK gerado automaticamente pelo GitHub Actions."
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
