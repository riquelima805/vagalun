name: Gerar APk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK)
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Usa a Action do Gradle oficial que gerencia permissões e cache automaticamente
    - name: Configurar o Gradle
      uses: gradle/actions/setup-gradle@v3

    # Se o gradlew estiver em uma pasta chamada "Adla", altere working-directory para ./Adla
    - name: Compilar o APK de Teste (Debug)
      working-directory: .
      run: ./gradlew assembleDebug

    - name: Publicar APK na aba Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0-${{ github.run_number }}"
        name: "Build Adla APK #${{ github.run_number }}"
        body: "APK gerado automaticamente via GitHub Actions."
        draft: false
        prerelease: false
        files: "**/build/outputs/apk/debug/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
